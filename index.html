<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIT Standard Secure Banking Engine</title>
    <!-- Tailwind CSS v4 CDN Link -->
  <link rel="stylesheet" href="/src/style.css" />

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Enterprise Dashboard Card -->
    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all duration-300 hover:border-emerald-500/50">
        
        <!-- Header Section (Semantic HTML) -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                MIT Core Engine v4
            </h1>
            <p class="text-slate-400 text-sm mt-2">Hardware-Level Memory & State Simulation</p>
        </header>

        <!-- Balance Display Panel -->
        <section class="bg-slate-900/50 border border-slate-700/50 p-6 rounded-xl text-center mb-6">
            <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">Secure Account Balance</h2>
            <!-- Dynamic Balance Row -->
            <div class="text-4xl font-black text-emerald-400 mt-2 tracking-tight">
                \$<span id="balanceDisplay">1000</span>
            </div>
        </section>

        <!-- Transaction Input Form -->
        <main class="space-y-4">
            <div>
                <label for="amountInput" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    Transaction Amount (\$)
                </label>
                <input 
                    type="number" 
                    id="amountInput" 
                    placeholder="Enter amount (e.g., 200)" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono"
                >
            </div>

            <!-- Operational Control Buttons -->
            <div class="grid grid-cols-2 gap-4 pt-2">
                <button 
                    id="depositBtn" 
                    class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-3 px-4 rounded-xl transition-all cursor-pointer shadow-lg shadow-emerald-950/20"
                >
                    Deposit
                </button>
                <button 
                    id="withdrawBtn" 
                    class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-bold py-3 px-4 rounded-xl transition-all cursor-pointer shadow-lg shadow-rose-950/20"
                >
                    Withdraw
                </button>
            </div>
        </main>

        <!-- Real-Time Hardware Logs Panel -->
        <footer class="mt-8 pt-6 border-t border-slate-700">
            <h3 class="text-xs font-bold uppercase tracking-widest text-cyan-400 mb-3">V8 Engine & RAM Logs</h3>
            <div id="logConsole" class="bg-slate-950 p-4 rounded-xl font-mono text-xs text-slate-400 h-32 overflow-y-auto space-y-1.5 scrollbar-thin">
                <div class="text-slate-500">&gt; Engine initialized. Creation phase complete.</div>
            </div>
        </footer>

    </div>
</body>
</html>
