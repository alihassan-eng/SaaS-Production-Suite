<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Tailwind v4 Setup</title>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-cyan-500 selection:text-slate-900"
  >
    <!-- Enterprise Dashboard Preview Container -->
    <div
      class="w-full max-w-2xl bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden group"
    >
      <!-- Ambient Background Glow -->
      <div
        class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none group-hover:bg-cyan-500/20 transition-all duration-700"
      ></div>
      <div
        class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none group-hover:bg-blue-500/20 transition-all duration-700"
      ></div>

      <!-- Header Section -->
      <div class="flex flex-col items-center text-center space-y-3 mb-8">
        <span
          class="px-3 py-1 text-xs font-medium tracking-wider text-cyan-400 bg-cyan-500/10 rounded-full border border-cyan-500/20 animate-pulse"
        >
          WSL 2 & pnpm Environment Active
        </span>
        <h1
          class="text-4xl sm:text-5xl font-extrabold tracking-tight bg-linear-to-r from-cyan-400 via-teal-300 to-blue-500 bg-clip-text text-transparent"
        >
          Silicon Valley Standard
        </h1>
        <p class="text-sm sm:text-base text-slate-400 max-w-md">
          High-performance Tailwind CSS v4 pipeline running seamlessly inside
          the browser engine.
        </p>
      </div>

      <!-- Metrics Grid (Simulating Warehouse Analytics) -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div
          class="bg-slate-950/40 border border-slate-800/80 rounded-xl p-4 transition-all duration-350 hover:border-slate-700"
        >
          <div
            class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1"
          >
            UI Latency
          </div>
          <div class="text-2xl font-bold text-emerald-400">0.0ms</div>
        </div>
        <div
          class="bg-slate-950/40 border border-slate-800/80 rounded-xl p-4 transition-all duration-350 hover:border-slate-700"
        >
          <div
            class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1"
          >
            State Sync
          </div>
          <div class="text-2xl font-bold text-cyan-400">Local-First</div>
        </div>
        <div
          class="bg-slate-950/40 border border-slate-800/80 rounded-xl p-4 transition-all duration-350 hover:border-slate-700"
        >
          <div
            class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1"
          >
            CSS JIT Bundle
          </div>
          <div class="text-2xl font-bold text-blue-400">Optimized</div>
        </div>
      </div>

      <!-- Action Button -->
      <div class="flex justify-center">
        <button
          class="px-6 py-3 font-semibold text-sm text-slate-950 bg-linear-to-r from-cyan-400 to-blue-500 rounded-xl shadow-lg shadow-cyan-500/10 hover:shadow-cyan-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer"
        >
          Initialize System Architecture
        </button>
      </div>
    </div>

    <!-- Script Entry (Required for Vite Execution) -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
